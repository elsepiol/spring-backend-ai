name: CI

# The "build agent": GitHub starts a fresh Ubuntu machine, checks out this repo,
# builds it and runs the tests. If anything fails, the commit gets a red cross.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven # reuse downloaded dependencies between runs

      - name: Build and test
        # Same command you run locally. Tests tagged "exercise" are skipped.
        run: ./mvnw -B verify

      - name: Build the Docker image
        # Proves the Dockerfile works. Not pushed anywhere yet.
        run: docker build -t shop:ci .
