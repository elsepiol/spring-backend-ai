name: CI

# The "build agent": GitHub starts a fresh Ubuntu machine, checks out this repo,
# builds it and runs the tests. If anything fails, the commit gets a red cross.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven # reuse downloaded dependencies between runs

      - name: Build and test
        # Same command you run locally. Tests tagged "exercise" are skipped.
        run: ./mvnw -B test -Pexercises -Dtest=Level1ExerciseTest


      - name: Assert the Level 1 exercise really ran and passed
        run: |
          grep -h "Tests run:" target/surefire-reports/*Level1ExerciseTest.txt
          grep -q "Tests run: 5, Failures: 0, Errors: 0, Skipped: 0" target/surefire-reports/*Level1ExerciseTest.txt

      - name: Publish failures as annotations
        if: failure()
        run: |
          grep -h -E "Tests run:|FAILURE|ERROR\]|expected|Status =" target/surefire-reports/*.txt | head -15 | while read -r l; do echo "::error::${l:0:300}"; done
