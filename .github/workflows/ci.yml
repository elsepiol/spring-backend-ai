name: CI

# The "build agent": GitHub starts a fresh Ubuntu machine, checks out this repo,
# builds it and runs the tests. If anything fails, the commit gets a red cross.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven # reuse downloaded dependencies between runs

      - name: Build and test
        # Same command you run locally. Tests tagged "exercise" are skipped.
        run: ./mvnw -B verify

      - name: Publish test failures as annotations
        # Shows failing tests on the run page without opening the raw log.
        if: failure()
        run: |
          shopt -s nullglob
          for f in target/surefire-reports/*.txt; do
            if grep -qE "<<< (FAILURE|ERROR)" "$f"; then
              msg=$(grep -E -A8 "<<< (FAILURE|ERROR)" "$f" | head -60 | cut -c1-300 | tr '\n' '|')
              echo "::error title=$(basename "$f")::${msg:0:3000}"
            fi
          done

      - name: Fail if any test was skipped
        # Docker is available here, so the database tests must have RUN.
        # Locally they skip when Docker is off; in CI a skip means something broke.
        run: |
          if grep -h "Skipped: [1-9]" target/surefire-reports/*.txt; then
            echo "Some tests were skipped in CI" >&2
            exit 1
          fi
          grep -h "Tests run:" target/surefire-reports/*.txt

      - name: Build the Docker image
        # Proves the Dockerfile works. Not pushed anywhere yet.
        run: docker build -t shop:ci .

      - name: Smoke test the image
        # Level 6: run the image we would deploy, against a real PostgreSQL, with the prod profile,
        # and check it becomes READY and answers. Tests prove the code; this proves the artifact.
        run: |
          docker network create smoke
          docker run -d --name smoke-db --network smoke \
            -e POSTGRES_DB=shop -e POSTGRES_USER=shop -e POSTGRES_PASSWORD=shop postgres:17-alpine
          until docker exec smoke-db pg_isready -U shop -d shop >/dev/null 2>&1; do sleep 1; done
          docker run -d --name smoke-app --network smoke -p 8080:8080 \
            -e SPRING_PROFILES_ACTIVE=prod -e DB_URL=jdbc:postgresql://smoke-db:5432/shop \
            -e JWT_SECRET=ci-smoke-test-only-secret-ci-smoke-test-only-secret shop:ci
          for i in $(seq 1 60); do
            curl -sf localhost:8080/actuator/health/readiness && break
            sleep 2
          done
          echo
          curl -sf localhost:8080/actuator/health/readiness
          curl -sf localhost:8080/api/v1/ping
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/api/v1/orders)" = 401
          # prod logs must be one JSON object per line (stdout only; the JVM may print notes on stderr)
          docker logs smoke-app 2>/dev/null | python3 -c "import sys, json; [json.loads(l) for l in sys.stdin if l.strip()]; print('logs are JSON')"

      - name: Smoke test the frontend image in front of the API
        # Frontend level: nginx serving the built app and passing /api to the backend container,
        # exactly as in production. Checks the things that only break in a real deployment.
        run: |
          docker build -t shop-frontend:ci frontend
          docker run -d --name smoke-web --network smoke -p 8081:8080 \
            -e API_UPSTREAM=http://smoke-app:8080 shop-frontend:ci
          for i in $(seq 1 30); do curl -sf localhost:8081/ >/dev/null && break; sleep 1; done
          curl -sf localhost:8081/ | grep -q '<div id="root">'
          # deep links get the app (single-page application fallback)
          curl -sf localhost:8081/products/1 | grep -q '<div id="root">'
          # security and cache headers
          curl -sI localhost:8081/ | grep -qi '^content-security-policy:'
          curl -sI localhost:8081/ | grep -qi '^cache-control: no-cache'
          asset=$(curl -s localhost:8081/ | grep -oE '/assets/[^"]+\.js' | head -1)
          curl -sI "localhost:8081$asset" | grep -qi 'immutable'
          # the API through the proxy, including a browser-style POST carrying the page's Origin
          curl -sf localhost:8081/api/v1/ping
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8081/api/v1/auth/register \
            -H 'Origin: http://localhost:8081' -H 'Content-Type: application/json' \
            -d '{"email":"smoke@example.com","password":"correct horse battery"}')
          test "$code" = 201
          # actuator is NOT reachable through the public entry point
          ! curl -s localhost:8081/actuator/prometheus | grep -q 'jvm_'
          echo "frontend smoke test passed"

      - name: Show the app's output if the smoke test failed
        if: failure()
        run: |
          docker logs smoke-app 2>&1 | tail -100 || true
          docker logs smoke-web 2>&1 | tail -50 || true

  # Frontend level: type check, unit and component tests, production build.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (exactly as locked)
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build

  # Level 6: the Kubernetes manifests must be valid for the Kubernetes API, field by field.
  manifests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Validate deploy/k8s with kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          ./kubeconform -strict -summary -kubernetes-version 1.33.0 deploy/k8s/

  # Proves every exercise fails before its solution and passes with it (see the script).
  exercises:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify exercises against reference solutions
        run: bash scripts/verify-exercises.sh

      - name: Publish test failures as annotations
        # Shows failing tests on the run page without opening the raw log.
        if: failure()
        run: |
          shopt -s nullglob
          for f in target/surefire-reports/*.txt; do
            if grep -qE "<<< (FAILURE|ERROR)" "$f"; then
              msg=$(grep -E -A8 "<<< (FAILURE|ERROR)" "$f" | head -60 | cut -c1-300 | tr '\n' '|')
              echo "::error title=$(basename "$f")::${msg:0:3000}"
            fi
          done
