# Level 6. Settings that are not secret. Changing them is a redeploy, not a rebuild.
apiVersion: v1
kind: ConfigMap
metadata:
  name: shop-config
  labels:
    app: shop
data:
  SPRING_PROFILES_ACTIVE: "prod"
  DB_URL: "jdbc:postgresql://shop-db.example.internal:5432/shop"
  DB_USER: "shop"
  DB_POOL_SIZE: "10"
  # Uncomment to send reads to a replica (Level 5):
  # DB_REPLICA_URL: "jdbc:postgresql://shop-db-replica.example.internal:5432/shop"
