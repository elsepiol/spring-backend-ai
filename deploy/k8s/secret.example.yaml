# Level 6. An EXAMPLE only: never commit real secrets, base64 is not encryption.
# Real clusters fill this from a secrets manager (External Secrets, Sealed Secrets, Vault,
# AWS Secrets Manager...) or create it by hand: kubectl create secret generic shop-secrets ...
apiVersion: v1
kind: Secret
metadata:
  name: shop-secrets
  labels:
    app: shop
type: Opaque
stringData:
  DB_PASSWORD: "replace-me"
  JWT_SECRET: "replace-me-with-at-least-32-random-bytes-from-a-secrets-manager"
