# Frontend level. The one public entry point. HTTPS ends here (the certificate is in the
# "shop-tls" Secret, typically issued by cert-manager), and every request goes to the frontend's
# nginx, which serves the app and passes /api on. The backend Service is not exposed directly.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shop
  labels:
    app: shop
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["shop.example.com"]
      secretName: shop-tls
  rules:
    - host: shop.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shop-frontend
                port:
                  name: http
