# Frontend level. Sent with every page and asset. (Included in each location below because nginx
# drops inherited add_header lines in any location that adds its own.)

# Content Security Policy: the browser may only run scripts, load styles and call APIs from OUR
# origin. If an attacker manages to inject <script src="https://evil.example/x.js"> through some
# XSS bug, the browser refuses to load it. Vite builds files only, no inline scripts, so 'self'
# is enough, without 'unsafe-inline'.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
# Do not guess content types (a text file must never be run as a script).
add_header X-Content-Type-Options "nosniff" always;
# Send only our origin, not full URLs, to other sites.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# This shop needs no camera, microphone or location.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Strict-Transport-Security (HSTS) belongs where HTTPS ends (the load balancer or ingress), not here.
