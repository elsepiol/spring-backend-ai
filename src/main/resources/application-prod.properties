# Level 6: settings for real environments. Activate with SPRING_PROFILES_ACTIVE=prod.
# Everything not set here comes from application.properties.

# One JSON object per log line (Elastic Common Schema), so a log platform (Loki, Elasticsearch,
# CloudWatch, Datadog) can search by field (level, logger, trace.id) instead of grepping text.
logging.structured.format.console=ecs

# Keep 10% of traces: enough to see patterns, far cheaper to store than all of them.
management.tracing.sampling.probability=0.1
