spring.application.name=shop

# Actuator: expose only what we need over HTTP. /actuator/health is what load
# balancers and Kubernetes call to ask "is this instance alive and ready?".
management.endpoints.web.exposure.include=health,info

# Database. The values after the colon are LOCAL DEVELOPMENT defaults that match
# docker-compose.yml. Real environments override them with environment variables.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/shop}
spring.datasource.username=${DB_USER:shop}
spring.datasource.password=${DB_PASSWORD:shop}

# Flyway owns the schema (src/main/resources/db/migration). Hibernate only checks
# at startup that the entities match the tables, and fails fast if they do not.
spring.jpa.hibernate.ddl-auto=validate

# Do not keep a database session open while the JSON response is being written.
spring.jpa.open-in-view=false

# Load lazy collections for a whole page of results in ONE query instead of one query per row (N+1).
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Never let a client ask for a million rows in one page.
spring.data.web.pageable.max-page-size=100

# Security (Level 2). HS256 needs a secret of at least 32 bytes. The default below is
# for LOCAL DEVELOPMENT ONLY: anyone who reads this repo knows it. Set JWT_SECRET in
# every real environment (the app logs a warning if the default is in use).
app.security.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
app.security.jwt.ttl=15m
app.security.jwt.issuer=shop

# Optional: create this ADMIN at startup if it does not exist. Leave unset in real environments.
app.security.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.security.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
