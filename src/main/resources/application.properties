spring.application.name=shop

# Actuator: expose only what we need over HTTP. /actuator/health is what load
# balancers and Kubernetes call to ask "is this instance alive and ready?".
# /actuator/metrics (Level 4) shows cache hit rates and connection pool usage; SecurityConfig
# makes it ADMIN only.
management.endpoints.web.exposure.include=health,info,metrics

# Database. The values after the colon are LOCAL DEVELOPMENT defaults that match
# docker-compose.yml. Real environments override them with environment variables.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/shop}
spring.datasource.username=${DB_USER:shop}
spring.datasource.password=${DB_PASSWORD:shop}

# Connection pool (HikariCP, Level 4). Every request that touches the database borrows one
# connection for as long as its transaction lasts, so this pool, not Tomcat's 200 threads, is
# what caps database throughput. Bigger is NOT better: PostgreSQL slows down with hundreds of
# busy connections, and every app instance has its own pool (5 instances x 10 = 50 on the DB).
# HikariCP's guide: start near (database CPU cores x 2) and measure.
spring.datasource.hikari.pool-name=shop-db
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
# minimum-idle is not set, so it defaults to maximum-pool-size: a fixed-size pool, which is what
# HikariCP recommends (no connection churn when a traffic spike arrives).
# How long a request waits for a free connection before failing (default 30000 ms). Under
# overload a fast "503, retry" beats 30 seconds of hanging threads piling up behind each other.
spring.datasource.hikari.connection-timeout=${DB_POOL_TIMEOUT_MS:2000}

# Flyway owns the schema (src/main/resources/db/migration). Hibernate only checks
# at startup that the entities match the tables, and fails fast if they do not.
spring.jpa.hibernate.ddl-auto=validate

# Do not keep a database session open while the JSON response is being written.
spring.jpa.open-in-view=false

# Load lazy collections for a whole page of results in ONE query instead of one query per row (N+1).
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Never let a client ask for a million rows in one page.
spring.data.web.pageable.max-page-size=100

# Cache (Level 4): Caffeine, in the memory of this JVM. Bounded (maximumSize, least useful
# entries are evicted first) and every entry expires 10 minutes after it was written. The expiry
# is the safety net for changes the app cannot see: a manual SQL fix, or an update handled by
# ANOTHER app instance, whose @CacheEvict only clears its own memory. recordStats feeds the
# cache.gets{result=hit|miss} numbers in /actuator/metrics.
spring.cache.type=caffeine
spring.cache.cache-names=products
spring.cache.caffeine.spec=maximumSize=10000,expireAfterWrite=10m,recordStats

# Security (Level 2). HS256 needs a secret of at least 32 bytes. The default below is
# for LOCAL DEVELOPMENT ONLY: anyone who reads this repo knows it. Set JWT_SECRET in
# every real environment (the app logs a warning if the default is in use).
app.security.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
app.security.jwt.ttl=15m
app.security.jwt.issuer=shop

# Optional: create this ADMIN at startup if it does not exist. Leave unset in real environments.
app.security.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.security.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
